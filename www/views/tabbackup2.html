<div id="tabbackup2" class="screentab" data-primarytab="false" hasback="true" data-title="Encrypted Backup" style="display: none;">
    <div class="divbackuprompt">
        <h3 style="color:black; text-align:center;">The data below is your encrypted wallet backup</h3>
        <p style="color:black;">You should make a new backup whenever you add a new account to your wallet, change your passphrase or change your pin. Toast Wallet will prompt you when a new backup is required.</p>
    	<center>
		    <button  id="btncopywallet" ontouchstart="ts(event)" ontouchend="te(event, ()=>{copySecretWithWarning(getVal('#walletbackup'), 'Wallet backup copied to clipboard.\n\nWARNING: Clipboard contents may be accessible to other apps. Toast Wallet will automatically attempt to clear your clipboard in 30 seconds.')})" type="button" class="btn btn-primary btnbig">Copy</button>
	    </center>
    	<label>Your backup</label>
	    <textarea oninput="setVal(this, domData(this, 'content'));" style="color:black;" id="walletbackup" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" readonly="readonly"></textarea>
    </div>
</div>
